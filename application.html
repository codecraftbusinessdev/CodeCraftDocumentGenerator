<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications</title>
    <link rel="stylesheet" href="application.css">
</head>
<body>

<button id="showButton" style="background-color: #4CAF50;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;">Load data
</button>

<table id="application_table">
    <thead>
    <tr>
        <th>Certificate ID</th>
        <th>Show</th>
        <th>Name</th>
        <th>Track</th>
        <th>Offer Letter</th>
        <th>Submission form</th>
        <th>Certificate</th>
        <th>Payment</th>

    </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    const showButton = document.getElementById('showButton');

    showButton.addEventListener('click', async () => {

    try {

    const response = await fetch('https://script.google.com/macros/s/AKfycbzXdOywfQMfjsIS8nslAH5Uwqi2V5j0VUyZrE1q7QA6o8XzsA8PihdqnKHsksv6WYDO/exec');
    const data = await response.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    const interns = data.data;
    application_table.tBodies[0].innerHTML = '';

    interns.forEach(intern=>{
        const tableRow1 = document.createElement('tr');

         tableRow1.innerHTML = `
        <td>${intern.certificate_id}</td>
        <td><a href="offer_letter_generate.html?id=${intern.certificate_id}">Generate</a></td>
        <td>${intern.name}</td>
        <td>${intern.internship_track}</td>
        <td>${intern.sent_offer_letter}</td>
        <td>${intern.sent_submission_form}</td>
        <td>${intern.sent_certificate}</td>
        <td>${intern.payment}</td>`;

    application_table.tBodies[0].appendChild(tableRow1);
    });

    } catch (error) {
        console.error('Error fetching certificate:', error);
        alert('An error occurred. Please try again later.' + error);
      }
    });


</script>


</body>

</html>
